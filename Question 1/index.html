<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="claimForm">
      <label>Claimant Name:</label>
      <input type="text" id="cName" />

      <label>E-mail</label>
      <input type="email" id="email" />

      <label>Product Code:</label>
      <input type="text" id="pCode" />

      <label>Claim Category: </label>
      <select>
        <option>Material Damage</option>
        <option>Theft</option>
        <option>Permanent Disability</option>
        <option>Death</option>
      </select>

      <label>Claim Description: </label>
      <textarea></textarea>

      <button id="button">Submit Form</button>
    </form>

    <h2 id="cStatus">Claim Status:</h2>
    <p id="disCStatus"></p>

    <h2 id="cStatus">Claim Record:</h2>
    <p id="disCRecord"></p>

    <script src="script.js"></script>
  </body>
</html>
